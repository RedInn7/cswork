# /etc/nginx/conf.d/cswork-http.conf, http level. The first block applies to EVERY
# site on this nginx (cswork, csgrad, oamaster). `gzip on;` stays in nginx.conf:
# repeating it here is a duplicate-directive error.
server_tokens off;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml font/ttf application/xml text/plain;

# cswork only, used by snippets/cswork-server.conf. Same fields as `combined` plus timing.
log_format cswork '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" $host rt=$request_time urt=$upstream_response_time';
# An empty key is not limited. Loopback is exempt so load tests on the server
# (--resolve cswork.org:443:127.0.0.1) measure the app, not these limits.
map $remote_addr $cswork_client {
    127.0.0.1 '';
    ::1 '';
    default $binary_remote_addr;
}
# The verdict long-poll (submissions/ID?wait=1) is exempt: the app already caps it
# per user (a reply per 500ms, two waiting, 360/min).
map "$uri?$arg_wait" $cswork_auth_key {
    ~^/api/auth/ $cswork_client;
    default '';
}
map "$uri?$arg_wait" $cswork_api_key {
    ~^/api/auth/ '';
    ~^/api/oj/submissions/[^/]+\?1$ '';
    ~^/api/ $cswork_client;
    default '';
}
limit_req_zone $cswork_auth_key zone=cswork_auth:10m rate=2r/s;
limit_req_zone $cswork_api_key zone=cswork_api:10m rate=10r/s;
# 429 body in the site language, like the app's errors (X-Locale: zh, else English).
map $http_x_locale $cswork_429_body {
    zh '{"error":"请求太频繁，请稍后再试"}';
    default '{"error":"Too many requests, please retry shortly"}';
}
