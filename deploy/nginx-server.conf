# /etc/nginx/snippets/cswork-server.conf, in every cswork server block.
# Format and zones: conf.d/cswork-http.conf.
access_log /var/log/nginx/cswork.access.log cswork;
limit_req zone=cswork_auth burst=20 nodelay;
limit_req zone=cswork_api burst=60 nodelay;
limit_req_status 429;
# The app's clients read `error` from a JSON body.
error_page 429 = @cswork_429;
location @cswork_429 {
    default_type application/json;
    return 429 '{"error":"请求太频繁，请稍后再试 / Too many requests, please retry shortly"}';
}
