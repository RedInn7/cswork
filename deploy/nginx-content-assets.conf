# Images of the read-only content library, copied to this server by fetch-images.mjs.
# Files are content-addressed (sha1 names), so they never change once published.
location ^~ /content-assets/ {
    alias /srv/cswork/content-assets/;
    types { image/png png; image/jpeg jpg; image/gif gif; image/webp webp; image/svg+xml svg; image/avif avif; }
    default_type application/octet-stream;
    # Only successful responses are cached (no "always"): a 404 must not stick for a month.
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff always;
    # An SVG opened directly must not run script on this origin.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}
