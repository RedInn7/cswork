# Only this teacher-authenticated endpoint receives a large package body.
# Authentication and a strict 128 MiB package limit are enforced by cswork.
location = /api/oj/admin/problems/save {
    client_max_body_size 129m;
    proxy_pass http://127.0.0.1:4317;
    proxy_http_version 1.1;
    # Forward headers immediately so the app can reject non-teachers before upload.
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
