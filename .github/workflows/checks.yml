name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:platform
      - run: npm run test:diagrams
      - run: node --test tests/import-gomall-videos.test.mjs
      - run: node --test tests/backup.test.mjs
      - run: npm run test:oj
      - run: npm run test:editor
      - run: npm run test:request-lifecycle
      - run: python3 tests/deploy-nginx.test.py
      - run: bash -n deploy/install.sh
      - run: npm run build
