name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/seo.test.ts tests/public-library.test.ts
      - run: node --import tsx --test tests/analytics.test.ts tests/analytics-events.test.ts tests/analytics-ui.test.mjs
      - run: npm run test:platform
      - run: npm run test:diagrams
      - run: npx tsx --test tests/interview-course.test.ts tests/algorithm-demo.test.ts
      - run: npx tsx --test tests/knowledge-progress.test.ts
      - run: node --import tsx --test tests/knowledge-navigation-ui.test.mjs
      - run: node --test tests/import-gomall-videos.test.mjs
      - run: node --test tests/backup.test.mjs
      - run: npm run test:oj
      - run: node --import tsx --test tests/oj-submission-contention.test.ts tests/oj-reference-run.test.ts
      - run: node --import tsx --test tests/stress-gen.test.ts tests/stress-runs.test.ts tests/stress-result-ui.test.mjs
      - run: npx tsx --test tests/oj-dispatch.test.ts tests/oj-compile-cache.test.ts tests/oj-cpp-runtime-compile.test.ts tests/oj-go-runtime-compile.test.ts
      - run: npx tsx --test tests/oj-case-stream.test.ts tests/oj-case-store.test.ts tests/oj-precompile.test.ts tests/oj-precompile-scheduler.test.ts tests/oj-python-bytecode.test.ts tests/oj-stdcxx-pch.test.ts
      - run: node --import tsx --test tests/oj-idle-precompile-ui.test.mjs
      - run: npx tsx --test tests/oj-submission-watch.test.ts tests/leetcode-cpp-value-transport.test.ts tests/leetcode-cpp-static-runtime.test.ts tests/leetcode-cpp-platform-types.test.ts tests/leetcode-go-platform-types.test.ts tests/leetcode-java-platform-types.test.ts tests/leetcode-mountain-guard.test.ts
      - run: npx tsx --test tests/oj-client-feedback.test.ts
      - run: node --import tsx --test tests/oj-failfast-ui.test.mjs tests/problem-timer-ui.test.mjs tests/hint-ladder-ui.test.mjs
      - run: node --import tsx --test tests/editor-settings-extras.test.ts tests/problem-stats.test.ts tests/workspace-cases-ui.test.mjs tests/testcase-fields.test.ts tests/testcase-structured-ui.test.mjs tests/editor-keybar-ui.test.mjs
      - run: node --check tests/oj-failfast-integration.mjs
      - run: node --check tests/oa-judge-integration.mjs
      - run: node --test tests/oa-native-reference.test.mjs
      - run: node --import tsx --test --test-concurrency=1 tests/oa-judge.test.ts tests/oa-judge-gate.test.ts tests/oa-judge-content.test.ts
      - run: node scripts/oa-judge/check-translations.mjs --quiet
      - run: node scripts/oa-judge/check-guides.mjs --quiet
      - run: node --import tsx --test tests/oa-guides.test.ts tests/oa-guides-ui.test.mjs
      # Builds and runs Python and C++ (Java and Go when the runner has them) like the judge.
      - run: node --import tsx --test tests/oa-verify-solutions.test.mjs
      - run: node --import tsx --test tests/oa-drills.test.ts tests/oa-drills-ui.test.mjs
      - run: node --check tests/oj-latency-load.mjs
      - run: node --test tests/oj-capacity-config.test.mjs tests/oj-capacity-release.test.mjs tests/oj-runner-swap.test.mjs
      - run: node --check tests/oj-capacity-benchmark.mjs
      - run: node --check tests/oj-capacity-admission-integration.mjs
      - run: bash -n tests/oj-capacity-benchmark.sh deploy/oj-capacity-release.sh deploy/oj-pandas-release.sh
      - run: node --check deploy/oj-queue-control.cjs
      - run: bash -n deploy/release.sh deploy/check-additive-migrations.sh
      - run: node --test tests/check-additive-migrations.test.mjs
      - run: npx tsx --test tests/oj-i18n.test.ts tests/study-library.test.ts tests/ling-curated.test.ts tests/practice-stats.test.ts tests/messages-en.test.ts tests/company-tags.test.ts
      - run: npx tsx --test tests/practice-round-migration.test.ts
      - run: node --import tsx --test tests/route-templates.test.ts tests/topics-pages-ui.test.mjs tests/route-stops.test.ts tests/roadmap-ui.test.mjs
      - run: node --import tsx --test tests/oj-deep-recursion.test.ts tests/auth-route.test.ts tests/problem-sequence.test.ts tests/health.test.ts tests/metrics-funnel.test.ts tests/bootstrap-catalogue.test.ts
      - run: node --import tsx --test tests/lazy-load-failed-ui.test.mjs tests/owner-metrics-ui.test.mjs
      - run: node --test tests/monitor-watch.test.mjs
      - run: node --import tsx --test tests/mock-oa.test.ts tests/mock-oa-mcq.test.ts tests/mock-oa-plus.test.ts tests/mock-interview.test.ts tests/mock-interview-feedback.test.ts tests/mock-interview-feedback-ui.test.mjs tests/oa-pages.test.ts tests/problem-hint.test.ts
      - run: node --import tsx --test tests/mock-oa-ui.test.mjs tests/mock-oa-plus-ui.test.mjs tests/oa-exam-format-ui.test.mjs tests/oa-mcq-ui.test.mjs
      - run: node --import tsx --test tests/classic-lists.test.ts tests/classic-lists-ui.test.mjs
      - run: node --import tsx --test tests/speedrun.test.ts tests/speedrun-api.test.ts tests/speedrun-ui.test.mjs
      - run: node --import tsx --test tests/pattern-flowchart.test.ts tests/pattern-flowchart-ui.test.mjs
      - run: node --import tsx --test tests/company-hub.test.ts
      - run: node --import tsx --test tests/company-stats.test.ts
      - run: node --import tsx --test tests/content-library-ui.test.mjs tests/library-popular.test.ts
      - run: node --import tsx --test tests/leetcode-sync.test.ts tests/leetcode-practice-progress.test.ts
      - run: node --import tsx --test tests/leetcode-sync-ui.test.mjs
      - run: node --import tsx --test tests/study-library-ui.test.mjs
      - run: node --import tsx --test tests/my-practice.test.ts tests/my-progress-ui.test.mjs tests/problem-notes-ui.test.mjs tests/submission-note-ui.test.mjs
      - run: node --import tsx --test tests/daily-problem.test.ts tests/achievements.test.ts tests/practice-loop-ui.test.mjs tests/daily-month-ui.test.mjs
      - run: node --import tsx --test tests/learner-cloud.test.ts tests/learner-cloud-ui.test.mjs
      - run: node --import tsx --test tests/profile-fields.test.ts tests/profile-recap.test.ts tests/profile-recap-ui.test.mjs
      - run: node --import tsx --test tests/ai-tutor.test.ts tests/ai-tutor-ui.test.mjs
      - run: node --import tsx --test tests/ai-assisted.test.ts tests/ai-assisted-ui.test.mjs
      - run: node --import tsx --test tests/oa-rest-fixtures.test.ts
      - run: node --import tsx --test tests/ica.test.ts tests/ica-ui.test.mjs
      - run: node --import tsx --test tests/workspace-plus-ui.test.mjs tests/workspace-exam-meta-ui.test.mjs
      - run: node --import tsx --test tests/ai-interviewer.test.ts tests/ai-interviewer-steps.test.ts tests/ai-roleplay.test.ts tests/ai-roleplay-ui.test.mjs tests/mock-ai-interview-ui.test.mjs tests/mock-ai-steps-ui.test.mjs tests/mock-replay.test.ts tests/mock-replay-ui.test.mjs
      - run: node --import tsx --test tests/solution-posts.test.ts tests/solution-posts-ui.test.mjs
      - run: node --import tsx --test tests/discuss-v2.test.ts tests/discuss-v2-ui.test.mjs
      - run: node --import tsx --test tests/experience-submissions.test.ts tests/experience-submissions-ui.test.mjs
      - run: node --import tsx --test tests/reminders.test.ts tests/company-follows.test.ts tests/reminders-ui.test.mjs
      - run: node --import tsx --test tests/study-groups.test.ts tests/study-groups-ui.test.mjs
      - run: node --import tsx --test tests/mock-peer.test.ts tests/peer-mock-plus-ui.test.mjs tests/group-camp.test.ts tests/newsletter.test.ts tests/course-gift.test.ts tests/peer-cohort-gift-ui.test.mjs
      - run: node --import tsx --test tests/community.test.ts tests/community-ui.test.mjs
      - run: node --import tsx --test tests/posts-plus.test.ts tests/posts-plus-ui.test.mjs
      - run: node --import tsx --test tests/code-reviews.test.ts tests/code-review-ui.test.mjs
      - run: node --import tsx --test tests/community-messages.test.ts tests/community-messages-ui.test.mjs
      - run: node --import tsx --test tests/community-search-stats.test.ts tests/community-search-stats-ui.test.mjs
      - run: node --import tsx --test tests/api-tokens.test.ts tests/mcp-server.test.mjs tests/mcp-ui.test.mjs
      - run: node --import tsx --test tests/lc-ratings.test.ts tests/points.test.ts tests/practice-ratings-ui.test.mjs
      - run: node --import tsx --test tests/story-bank.test.ts tests/interview-prep-ui.test.mjs
      - run: node --import tsx --test tests/ai-answer.test.ts tests/answer-grade-ui.test.mjs
      - run: node --import tsx --test tests/study-plan.test.ts tests/study-plan-ui.test.mjs
      - run: node --import tsx --test tests/editor-format.test.ts tests/user-drafts.test.ts tests/playground.test.ts tests/playground-ui.test.mjs tests/workspace-sync-ui.test.mjs
      - run: node --import tsx --test tests/ai-ask.test.ts tests/command-palette-ui.test.mjs tests/seo-facets.test.ts tests/company-insights.test.ts tests/pwa.test.mjs
      - run: node --import tsx --test tests/python-debugger.test.ts tests/python-debugger-ui.test.mjs
      - run: node --import tsx --test tests/ling-editorials.test.ts tests/system-design-course.test.ts tests/content-courses-ui.test.mjs tests/system-design-reader-ui.test.mjs tests/estimation-drill.test.mjs
      - run: node --import tsx --test tests/algorithm-demo-topics.test.ts tests/algorithm-demo-ui.test.mjs tests/course-catalog.test.ts tests/ai-resume.test.ts tests/career-guide-ui.test.mjs tests/visa-timeline.test.ts tests/visa-timeline-ui.test.mjs tests/h1b.test.ts tests/applications.test.ts tests/application-tracker-ui.test.mjs
      - run: node --import tsx --test tests/contests.test.ts tests/contests-ui.test.mjs tests/contest-fairness.test.ts tests/contest-tiers.test.ts tests/duels.test.ts
      - run: node --import tsx --test tests/share-cards.test.ts tests/resume-builder.test.ts tests/resume-builder-ui.test.mjs
      - run: node --import tsx --test tests/skill-tests.test.ts tests/skill-test-ui.test.mjs tests/course-ratings.test.ts tests/beginner-courses.test.ts tests/learn-ui.test.mjs
      - run: node --test --test-concurrency=1 tests/oa-import.test.mjs
      - run: node --import tsx --test --test-concurrency=1 tests/oa-library.test.ts tests/oa-library-ui.test.mjs
      - run: node --import tsx --test tests/judge-status-ui.test.mjs
      - run: node --import tsx --test tests/dark-theme.test.mjs
      # The Pandas track's build check and harness tests run on the system python's pandas.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pandas
      - run: node --import tsx --test tests/sql-track.test.ts tests/sql-track-ui.test.mjs tests/pandas-track.test.ts
      - run: node --import tsx --test tests/book-problems.test.ts
      - run: node --import tsx --test tests/book-lists-ui.test.mjs tests/sql-result-diff.test.ts tests/sql-result-diff-ui.test.mjs tests/pandas-workspace-ui.test.mjs
      - run: node --test tests/oa-stripe-payments-capacity.test.mjs
      - run: node --import tsx --test tests/oa-verified-statement.test.ts tests/oa-output-checker.test.ts
      - run: node --import tsx --test tests/oa-semantic-checkers.test.ts
      - run: node --import tsx --test tests/oa-regional-maxima.test.ts
      - run: node --import tsx --test tests/oa-allocation-checkers.test.ts
      - run: node --import tsx --test tests/oa-dictionary-checker.test.ts tests/oa-float-array.test.ts
      - run: node --import tsx --test tests/oa-cidr-checker.test.ts
      - run: node --import tsx --test tests/oa-json-diff-checker.test.ts
      - run: node --import tsx --test tests/oa-longest-palindrome-checker.test.ts
      - run: node --import tsx --test tests/oa-piecewise-linear-checker.test.ts
      - run: node --import tsx --test tests/oa-tree-max-path-checker.test.ts tests/oa-tree-max-path-integration.test.ts
      - run: node --test tests/oa-codeium-sequence-checker.test.mjs
      - run: node --import tsx --test tests/oa-codeium-sequence-integration.test.ts
      - run: node --test tests/oa-morgan-bricks-checker.test.mjs
      - run: node --import tsx --test tests/oa-morgan-bricks-integration.test.ts
      - run: node --import tsx --test tests/oa-wayfair-bricks-integration.test.ts
      - run: node --test tests/oa-zalando-blocks-checker.test.mjs
      - run: node --test tests/oa-binary-search-witness.test.mjs tests/oa-no-input-coverage.test.mjs
      - run: node --import tsx --test tests/oa-binary-search-integration.test.ts
      - run: node --import tsx --test tests/oa-zalando-blocks-integration.test.ts
      - run: node --test tests/oa-uber-semantic-checkers.test.mjs tests/oa-bounded-file.test.mjs
      - run: node --import tsx --test --test-concurrency=1 tests/oj-input-capacity.test.ts tests/oj-import-budget.test.ts
      - run: node --check tests/oj-large-input-probe.mjs
      - run: node scripts/oa-judge/coverage.mjs --check
      - run: node --test tests/oa-coverage.test.mjs tests/oa-publisher-coverage.test.mjs
      - run: node --test tests/oa-authoring-utf8.test.mjs
      - run: node --import tsx --test tests/leetcode-workspace-ui.test.mjs
      - run: node --import tsx --test tests/statement-markdown.test.mjs
      - run: npx tsx --test tests/coding-mode.test.ts
      - run: npx tsx --test tests/acm-io-templates.test.ts
      - run: node --import tsx --test tests/judge-environment-ui.test.mjs
      - run: node --import tsx --test tests/code-analyzer.test.ts tests/analyzer-notes-ui.test.mjs
      - run: npx tsx --test tests/leetcode-public-samples.test.ts
      - run: python3 scripts/leetcode-mode/test_runtime.py
      - run: python3 tests/cpp-json-runtime.test.py
      - run: python3 tests/oa-local-batch-runner.test.py
      - run: python3 -m unittest discover -s scripts/ling-validation -p 'test_*.py'
      - run: python3 tests/import-ling-library.test.py
      - run: npm run test:editor
      - run: npm run test:request-lifecycle
      - run: node --test tests/tailwind-source-boundary.test.mjs
      - run: python3 tests/deploy-nginx.test.py
      - run: python3 tests/prune-releases.test.py
      - run: bash -n deploy/install.sh deploy/app-only-release.sh deploy/release.sh deploy/prune-releases.sh && node --check scripts/oa-judge/unpublished-batches.mjs
      - run: npm run build
      - run: node tests/seo-http.mjs
      - run: node tests/oa-library-http.mjs
      - run: node tests/leetcode-sync-http.mjs
  # Compiles and runs code in four languages, beside validate (which is close to its 20 minutes).
  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Builds and runs every lesson run block: C++, Java and Go (each when the runner has it), SQL on the sample tables.
      - run: node --import tsx scripts/learn/check-snippets.mjs
      - run: node --import tsx --test tests/core-skills.test.ts tests/core-skills-ui.test.mjs
      # The concurrency drivers are randomized: rerun every solution, and every racy variant must fail.
      - run: node --import tsx scripts/core-skills/stress.ts
